[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baboom"
version = "0.1.0"
description = ""
requires-python = ">= 3.14"

dependencies = [
  "gunicorn",
  "psycopg",
  "django>=6.0",
  "django-treebeard",
  "django-nested-admin",
  "django-environ",
  "celery[redis]",
  "urllib3",
  "curl_cffi",
  "django-celery-results",
  "django-celery-beat",
  "pydantic",
  "sentry-sdk",
  "django-components",
  # Fork until the inline-name and multiselect fixes land upstream.
  "django-admin-rest-api @ git+https://github.com/rflemerson/django-admin-rest-api@fix-inline-names-and-multiselect",
  "django-admin-mcp-api",
  "django-oauth-toolkit>=3.4.1",
]

[tool.hatch.metadata]
# The admin-api dependency is a git reference while two fixes are upstream.
allow-direct-references = true

[project.urls]
Repository = "https://github.com/rflemerson/baboom"

[project.optional-dependencies]
dev = [
  "mypy",
  "django-stubs",
  "django-stubs-ext",
  "ruff",
  "pre-commit",
  "deptry",
  "vulture",
  "safety",
  "factory-boy",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-asyncio",
  "pytest-sugar",
]
