[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baboom"
version = "0.1.0"
description = ""
requires-python = ">= 3.14"

dependencies = [
  "gunicorn",
  "psycopg",
  "django>=6.0",
  "django-treebeard",
  "django-nested-admin",
  "django-environ",
  "celery[redis]",
  "scrapy>=2.13.4",
  "scrapy-impersonate==1.9.0",
  "twisted",
  "django-celery-results",
  "django-celery-beat",
  "pydantic",
  "sentry-sdk",
  "django-components",
  # Fork until the inline-name and multiselect fixes land upstream.
  "django-admin-rest-api @ git+https://github.com/rflemerson/django-admin-rest-api@fix-inline-names-and-multiselect",
  # Fork until the protocol fixes land upstream.
  "django-admin-mcp-api @ git+https://github.com/rflemerson/django-admin-mcp-api@fix-protocol-conformance",
  "django-oauth-toolkit>=3.4.1",
]

[tool.hatch.metadata]
# The admin-api dependency is a git reference while two fixes are upstream.
allow-direct-references = true

[project.urls]
Repository = "https://github.com/rflemerson/baboom"

[project.optional-dependencies]
dev = [
  "mypy",
  "django-stubs",
  "django-stubs-ext",
  "ruff",
  "pre-commit",
  "deptry",
  "jsonschema",
  "vulture",
  "safety",
  "factory-boy",
  "pytest",
  "coverage",
  "pytest-cov",
  "pytest-django",
  "pytest-asyncio",
  "pytest-sugar",
]

[tool.coverage.run]
# Run with: coverage run manage.py test && coverage report
branch = true
source = ["."]
omit = [
  ".venv/*",
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "baboom/settings/*",
  "baboom/asgi.py",
  "baboom/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
