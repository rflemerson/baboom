{% if show %}
    <nav class="toplinks">
        {% if back %}<a href="{{ back.link }}" class="date-back">&lsaquo; {{ back.title }}</a>{% endif %}
        {% for choice in choices %}
            {% if choice.link %}
                <a href="{{ choice.link }}">{{ choice.title }}</a>
            {% else %}
                {{ choice.title }}
            {% endif %}
        {% endfor %}
    </nav>
{% endif %}
