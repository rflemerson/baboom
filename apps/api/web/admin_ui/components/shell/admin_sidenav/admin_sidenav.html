{% load i18n %}
<button class="sticky toggle-nav-sidebar"
        id="toggle-nav-sidebar"
        aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky"
     id="nav-sidebar"
     aria-label="{% translate 'Sidebar' %}">
    <input type="search"
           id="nav-filter"
           placeholder="{% translate 'Start typing to filter…' %}"
           aria-label="{% translate 'Filter navigation items' %}">
    <div class="app-list">
        {% for app in available_apps %}
            <div class="app-{{ app.app_label }} module{% if app.app_url in current_path %} current-app{% endif %}">
                <table>
                    <caption>
                        <a href="{{ app.app_url }}" class="section">{{ app.name }}</a>
                    </caption>
                    {% for model in app.models %}
                        <tr class="model-{{ model.object_name|lower }}{% if current_path == model.admin_url %} current-model{% endif %}">
                            <th scope="row">
                                <a href="{{ model.admin_url }}"
                                   {% if current_path == model.admin_url %}aria-current="page"{% endif %}>{{ model.name }}</a>
                            </th>
                        </tr>
                    {% endfor %}
                </table>
            </div>
        {% empty %}
            <p>{% translate "No available apps." %}</p>
        {% endfor %}
    </div>
</nav>
