#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
    { id = "check-merge-conflict" },
    # The vendored MCP spec must stay byte-identical to upstream to be diffable.
    { id = "end-of-file-fixer", exclude = "^apps/api/mcp_server/spec/" },
    { id = "trailing-whitespace", exclude = "^apps/api/mcp_server/spec/" },
    { id = "mixed-line-ending" },
]
