# Local development database. Tests and the dev server both use it:
#   docker compose -f docker-compose.dev.yml up -d
# The credentials are local-only; nothing here is read in production.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:55440:5432"
    environment:
      POSTGRES_USER: baboom
      POSTGRES_PASSWORD: baboom-dev
      POSTGRES_DB: baboom
    volumes:
      - dev_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baboom"]
      interval: 3s
      retries: 20

volumes:
  dev_db:
