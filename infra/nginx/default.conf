upstream api_app {
    server api:8000;
}

upstream web_app {
    server web:80;
}

server {
    listen 80;
    server_name baboom.com.br www.baboom.com.br;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name baboom.com.br www.baboom.com.br;

    ssl_certificate /etc/letsencrypt/live/baboom.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baboom.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location /media/ {
        alias /app/media/;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://api_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://api_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # The MCP endpoint and the OAuth server it is authenticated by. Both
    # .well-known documents must answer on the origin, where the specs put
    # them. /admin-api/ is deliberately absent: nothing outside reaches it.
    location /mcp/ {
        proxy_pass http://api_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # Longer than gunicorn's own timeout. The default is 60s, shorter than
        # gunicorn's 120s, so on a swapping box nginx answered the client with
        # an error while the worker was still doing the work and about to
        # succeed. Whoever gives up first should be the one holding the work.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /o/ {
        proxy_pass http://api_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource) {
        proxy_pass http://api_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
