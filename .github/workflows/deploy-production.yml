name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull images and restart stack
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "${{ vars.PRODUCTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship deployment secrets
        env:
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
          OIDC_RSA_PRIVATE_KEY: ${{ secrets.OIDC_RSA_PRIVATE_KEY }}
          CATALOG_OPERATOR_PASSWORD: ${{ secrets.CATALOG_OPERATOR_PASSWORD }}
          MCP_RESOURCE_IDENTIFIER: ${{ vars.MCP_RESOURCE_IDENTIFIER }}
          OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
          MCP_CLIENT_HOSTS: ${{ vars.MCP_CLIENT_HOSTS }}
          CATALOG_OPERATOR_USERNAME: ${{ vars.CATALOG_OPERATOR_USERNAME }}
          CATALOG_OPERATOR_EMAIL: ${{ vars.CATALOG_OPERATOR_EMAIL }}
        run: |
          # Over stdin, never as arguments: a command line is visible in the
          # remote process listing, and one of these is a signing key.
          # %q so the deploy can source the file: these values carry spaces.
          {
            printf 'OIDC_RSA_PRIVATE_KEY=%q\n' "$OIDC_RSA_PRIVATE_KEY"
            printf 'CATALOG_OPERATOR_PASSWORD=%q\n' "$CATALOG_OPERATOR_PASSWORD"
            printf 'MCP_RESOURCE_IDENTIFIER=%q\n' "$MCP_RESOURCE_IDENTIFIER"
            printf 'OAUTH_ISSUER=%q\n' "$OAUTH_ISSUER"
            printf 'MCP_CLIENT_HOSTS=%q\n' "$MCP_CLIENT_HOSTS"
            printf 'CATALOG_OPERATOR_USERNAME=%q\n' "$CATALOG_OPERATOR_USERNAME"
            printf 'CATALOG_OPERATOR_EMAIL=%q\n' "$CATALOG_OPERATOR_EMAIL"
          } | ssh -i ~/.ssh/production_key "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "umask 077 && cat > /home/ubuntu/app/baboom/.env.oauth"

      - name: Deploy over SSH
        env:
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_SEND_DEFAULT_PII: ${{ vars.SENTRY_SEND_DEFAULT_PII }}
          SENTRY_MONITOR_CELERY_BEAT: ${{ vars.SENTRY_MONITOR_CELERY_BEAT }}
        run: |
          ssh -i ~/.ssh/production_key "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "cd /home/ubuntu/app/baboom \
              && git pull --ff-only origin main \
              && DEPLOY_SKIP_GIT_UPDATE=1 \
                REGISTRY=$(printf '%q' "$REGISTRY") \
                IMAGE_OWNER=$(printf '%q' "$IMAGE_OWNER") \
                GHCR_USER=$(printf '%q' "$GHCR_USER") \
                GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") \
                SENTRY_DSN=$(printf '%q' "$SENTRY_DSN") \
                SENTRY_TRACES_SAMPLE_RATE=$(printf '%q' "$SENTRY_TRACES_SAMPLE_RATE") \
                SENTRY_SEND_DEFAULT_PII=$(printf '%q' "$SENTRY_SEND_DEFAULT_PII") \
                SENTRY_MONITOR_CELERY_BEAT=$(printf '%q' "$SENTRY_MONITOR_CELERY_BEAT") \
                ./infra/deploy/production.sh"
