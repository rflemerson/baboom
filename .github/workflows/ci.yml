name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to a branch supersedes the older run, except on main, where
# every run finishes because it decides whether images are published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prek:
    name: prek (all hooks, all scopes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      # The deptry hook runs apps/api/.venv/bin/python, so the environment has
      # to live exactly there.
      - name: Install API environment
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml', 'apps/api/prek.toml', 'apps/web/prek.toml') }}

      - name: Run prek
        run: apps/api/.venv/bin/prek run --all-files --show-diff-on-failure

  test:
    name: tests and coverage (Postgres 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: baboom
          POSTGRES_PASSWORD: baboom
          POSTGRES_DB: baboom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baboom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values: not secrets, and no .env exists on the runner.
      DJANGO_SECRET_KEY: ci-test-only-secret
      DATABASE_URL: postgres://baboom:baboom@localhost:5432/baboom
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      # psycopg is the pure-Python build and loads the system libpq, as the
      # production image does with libpq-dev.
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5

      - name: Install API environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Confirm the tests run on Postgres
        run: |
          .venv/bin/python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'baboom.settings')
          django.setup()
          from django.db import connection
          assert connection.vendor == 'postgresql', connection.vendor
          print('database:', connection.vendor)
          "

      - name: Django system checks
        run: .venv/bin/python manage.py check

      - name: No model change without a migration
        run: .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: .venv/bin/coverage run manage.py test --shuffle

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Coverage"
              echo
              .venv/bin/coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
            .venv/bin/coverage report
          else
            echo "No coverage data: the test step did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

